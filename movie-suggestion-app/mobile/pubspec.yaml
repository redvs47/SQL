name: movie_suggestion_app
description: A Flutter mobile app for collaborative movie suggestions and reviews
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.2

  # Local Storage
  shared_preferences: ^2.2.2

  # Video
  camera: ^0.10.5+9
  video_player: ^2.8.2
  image_picker: ^1.0.7
  path_provider: ^2.1.2

  # Permissions
  permission_handler: ^11.2.0

  # Utilities
  intl: ^0.19.0
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
